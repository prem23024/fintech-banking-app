apiVersion: apps/v1
kind: Deployment
metadata:
  name: fintech-frontend
  labels:
    app: fintech-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fintech-frontend
  template:
    metadata:
      labels:
        app: fintech-frontend
    spec:
      containers:
      - name: frontend
        image: fintech-fullstack-deploy-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        env:
        - name: VITE_API_BASE_URL
          value: "http://backend-service:8080"